name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linters
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          uv sync --project backend --frozen
      - name: Frontend lint
        run: npm --prefix frontend run lint
      - name: Python lint
        run: uv run --project backend --frozen ruff check backend
      - name: Python formatting
        run: uv run --project backend --frozen ruff format --check backend

  backend:
    name: Backend and MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: iseday_test
          MYSQL_ROOT_PASSWORD: iseday_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 127.0.0.1:13306:3306
        options: >-
          --health-cmd "MYSQL_PWD=iseday_test mysql -h 127.0.0.1 -u root iseday_test -e 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:iseday_test@127.0.0.1:13306/iseday_test
      REQUIRE_MYSQL_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --project backend --frozen
      - name: Configure MySQL triggers
        run: |
          docker exec -e MYSQL_PWD=iseday_test "${{ job.services.mysql.id }}" mysql -u root \
            -e "SET GLOBAL log_bin_trust_function_creators = ON"
      - name: Backend unit tests
        run: uv run --project backend --frozen pytest backend/tests --ignore=backend/tests/mysql
      - name: Backend MySQL integration tests
        run: uv run --project backend --frozen pytest backend/tests/mysql

  browser:
    name: Frontend and browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: iseday_test
          MYSQL_ROOT_PASSWORD: iseday_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 127.0.0.1:13306:3306
        options: >-
          --health-cmd "MYSQL_PWD=iseday_test mysql -h 127.0.0.1 -u root iseday_test -e 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:iseday_test@127.0.0.1:13306/iseday_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          uv sync --project backend --frozen
      - name: Configure MySQL triggers
        run: |
          docker exec -e MYSQL_PWD=iseday_test "${{ job.services.mysql.id }}" mysql -u root \
            -e "SET GLOBAL log_bin_trust_function_creators = ON"
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend and Playwright typecheck
        run: npm --prefix frontend run typecheck
      - name: Frontend build
        run: npm --prefix frontend run build:assets
      - name: Browser tests on the built app
        run: npm --prefix frontend run test:preview -- --workers=1
      - name: Browser tests with real API and MySQL
        run: npm --prefix frontend run test:live -- --workers=1
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  production:
    name: Production Docker and HTTPS
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Production checks with disposable containers
        run: make check-production
      - name: Upload production failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-test-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
