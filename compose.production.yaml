name: iseday-quiz-production

x-api: &api
  image: iseday-quiz-production-api:${APP_IMAGE_TAG:-latest}
  build: ./backend
  environment:
    APP_ENV: production
    DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL em .env.production}
    PRIVACY_NOTICE_VERSION: ${PRIVACY_NOTICE_VERSION:?Defina a versão do aviso institucional}
    PRIVACY_NOTICE_TEXT: ${PRIVACY_NOTICE_TEXT:?Defina o aviso institucional}
    PARTICIPANT_SESSION_MINUTES: ${PARTICIPANT_SESSION_MINUTES:-60}
    PARTICIPANT_REGISTRATION_LIMIT: ${PARTICIPANT_REGISTRATION_LIMIT:-60}
    PARTICIPANT_SUBMISSION_LIMIT: ${PARTICIPANT_SUBMISSION_LIMIT:-120}
    ADMIN_SESSION_MINUTES: ${ADMIN_SESSION_MINUTES:-480}
    ADMIN_LOGIN_LIMIT: ${ADMIN_LOGIN_LIMIT:-10}
  networks:
    - backend
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina uma senha exclusiva de produção}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    <<: *api
    restart: "no"
    command: [/app/.venv/bin/alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    # A API é acessível apenas na rede Docker interna, sem porta publicada no host.
    # O Caddy descarta X-Forwarded-* fornecidos pelo cliente antes de encaminhar.
    # Um único worker mantém os limites de requisições consistentes por processo.
    command:
      - /app/.venv/bin/uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --no-access-log
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: iseday-quiz-production-frontend:${APP_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Defina o domínio ou localhost para ensaio local}
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - backend
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

networks:
  backend:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
