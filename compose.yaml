name: iseday-quiz

# Ambiente de desenvolvimento. Credenciais locais definidas em .env.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copie .env.example para .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PRIVACY_NOTICE_VERSION: ${PRIVACY_NOTICE_VERSION:-}
      PRIVACY_NOTICE_TEXT: ${PRIVACY_NOTICE_TEXT:-}
      PARTICIPANT_SESSION_MINUTES: ${PARTICIPANT_SESSION_MINUTES:-60}
      PARTICIPANT_REGISTRATION_LIMIT: ${PARTICIPANT_REGISTRATION_LIMIT:-60}
      PARTICIPANT_SUBMISSION_LIMIT: ${PARTICIPANT_SUBMISSION_LIMIT:-120}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - api

volumes:
  postgres_data:
