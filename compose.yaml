name: iseday-quiz

# Ambiente de desenvolvimento. Credenciais locais definidas em .env.
services:
  db:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=ON"]
    environment:
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Copie .env.example para .env}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?charset=utf8mb4
      PRIVACY_NOTICE_VERSION: ${PRIVACY_NOTICE_VERSION:-}
      PRIVACY_NOTICE_TEXT: ${PRIVACY_NOTICE_TEXT:-}
      PARTICIPANT_SESSION_MINUTES: ${PARTICIPANT_SESSION_MINUTES:-60}
      PARTICIPANT_REGISTRATION_LIMIT: ${PARTICIPANT_REGISTRATION_LIMIT:-60}
      PARTICIPANT_SUBMISSION_LIMIT: ${PARTICIPANT_SUBMISSION_LIMIT:-120}
      ADMIN_SESSION_MINUTES: ${ADMIN_SESSION_MINUTES:-480}
      ADMIN_LOGIN_LIMIT: ${ADMIN_LOGIN_LIMIT:-10}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - api

volumes:
  mysql_data:
