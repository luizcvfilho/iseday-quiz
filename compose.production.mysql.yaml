# Adiciona um MySQL no próprio Compose, quando não há um servidor externo.
services:
  db:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=ON"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina uma senha exclusiva de produção}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:

networks:
  backend:
    internal: true
